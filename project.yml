name: SAVY
options:
  bundleIdPrefix: com.adamblair
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7FKUS5M5QS

packages:
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    from: 2.46.0

targets:
  SAVY:
    type: application
    platform: iOS
    configFiles:
      Debug: SAVY.xcconfig
      Release: SAVY.xcconfig
    dependencies:
      - package: Amplify
        product: Amplify
      - package: Amplify
        product: AWSCognitoAuthPlugin
      - package: Amplify
        product: AWSPluginsCore
    sources:
      - path: SAVY
    resources:
      - path: SAVY/amplifyconfiguration.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.savy
        CODE_SIGN_ENTITLEMENTS: SAVY/SAVY.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FKUS5M5QS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SAVY/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SAVY/SAVY-Mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_DEBUG_DYLIB: NO
  # Apple Watch capture, Nov 20, 2026 (watch capture kit: .cursor/skills/watch-capture).
  # Not embedded in the iPhone app yet: run the SAVYWatch scheme to install it on the Watch.
  # The project file was wired by `watchkit.py wire`; these entries mirror it.
  SAVYWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: SAVYWatch
      - path: SAVY/WatchCapture.swift
      - path: SAVY/WatchCaptureConfig.swift
    dependencies:
      - target: SAVYWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.savy.watchkitapp
        CODE_SIGN_ENTITLEMENTS: SAVYWatch/SAVYWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FKUS5M5QS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SAVY
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.adamblair.savy
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SAVYWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: SAVYWatchWidgets
      - path: SAVY/WatchCaptureConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.savy.watchkitapp.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7FKUS5M5QS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SAVYWatchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SAVY
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SAVYTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SAVYTests
    dependencies:
      - target: SAVY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.savy.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SAVY.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SAVY"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SAVYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SAVYUITests
    dependencies:
      - target: SAVY
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adamblair.savy.uitests
        TEST_TARGET_NAME: SAVY

schemes:
  SAVY:
    build:
      targets:
        SAVY: all
        SAVYTests: [test]
        SAVYUITests: [test]
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
      debugEnabled: false
      targets:
        - SAVYTests
        - SAVYUITests
