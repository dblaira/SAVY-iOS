# Watch capture kit. Compiles SAVY Watch and SAVY for iPhone on a GitHub macOS
# runner, unsigned; runs the Watch capture unit tests; and screenshots the Watch app in a Watch
# simulator with demo words. A build check only: nothing is signed, installed or published.
# Written by watchkit.py; change the kit template, not this file.
name: Watch build

on:
  push:
    paths:
      - "SAVY/**"
      - "SAVYWatch/**"
      - "SAVYWatchWidgets/**"
      - "SAVYTests/**"
      - "SAVY.xcodeproj/**"
      - ".cursor/skills/watch-capture/**"
      - "watch-capture.json"
      - ".github/workflows/watch-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: Watch app (watchOS Simulator) + screenshots
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Kit files match watch-capture.json
        run: |
          if [ -f .cursor/skills/watch-capture/scripts/watchkit.py ]; then
            python3 .cursor/skills/watch-capture/scripts/watchkit.py files --config watch-capture.json --check
          fi
      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build Watch app and complication
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project SAVY.xcodeproj \
            -scheme SAVYWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/watch \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/watch.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -E "error:" build/watch.log | sed -E 's/^.*\/([^/]+\.swift)/\1/' | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
          if ! grep -q -E "BUILD SUCCEEDED" build/watch.log; then
            echo "----- compiler crash context -----"
            grep -n -A60 "Command SwiftCompile failed" build/watch.log | grep -v -E "^[0-9]+-\s*$" | cut -c1-400 | head -120 || true
            echo "----- failure lines -----"
            grep -n -i -E "error|failed|fatal|cannot|unable" build/watch.log | grep -v -i "warning" | tail -60 || true
            echo "----- last 60 lines -----"
            tail -n 60 build/watch.log
            exit 1
          fi
      - name: Screenshots in a Watch simulator
        continue-on-error: true
        run: |
          set -x
          mkdir -p build/screenshots
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          watches = [d for runtime in sorted(devices, reverse=True) if "watchOS" in runtime
                     for d in devices[runtime] if d["name"].startswith("Apple Watch")]
          ultra = [d for d in watches if "Ultra" in d["name"]]
          print((ultra or watches)[0]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/watch/Build/Products -maxdepth 3 -path "*watchsimulator*" -name "SAVYWatch.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          for screen in home proof calendar; do
            xcrun simctl terminate "$UDID" com.adamblair.savy.watchkitapp || true
            xcrun simctl launch "$UDID" com.adamblair.savy.watchkitapp -WatchCaptureDemo "$screen"
            sleep 8
            xcrun simctl io "$UDID" screenshot "build/screenshots/$screen.png"
          done
          ls -la build/screenshots
          # Artifacts may be unreachable from where results are read, so the job log carries
          # each screenshot as base64 between markers.
          for f in build/screenshots/*.png; do
            echo "WATCH-SCREENSHOT-BEGIN $(basename "$f")"
            base64 -i "$f" | fold -w 1000
            echo "WATCH-SCREENSHOT-END $(basename "$f")"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload Watch log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watch-build-log
          path: build/watch.log

  phone:
    name: iPhone app (iOS Simulator) + Watch capture tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit()
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"
      - name: Build the iPhone app and its tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project SAVY.xcodeproj \
            -scheme SAVY \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/phone \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/phone.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)" || true
          grep -E "error:" build/phone.log | sed -E 's/^.*\/([^/]+\.swift)/\1/' | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
          if ! grep -q -E "TEST BUILD SUCCEEDED|BUILD SUCCEEDED" build/phone.log; then
            echo "----- compiler crash context -----"
            grep -n -A60 "Command SwiftCompile failed" build/phone.log | grep -v -E "^[0-9]+-\s*$" | cut -c1-400 | head -120 || true
            echo "----- failure lines -----"
            grep -n -i -E "error|failed|fatal|cannot|unable" build/phone.log | grep -v -i "warning" | tail -60 || true
            echo "----- last 60 lines -----"
            tail -n 60 build/phone.log
            exit 1
          fi
      - name: Run Watch capture tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project SAVY.xcodeproj \
            -scheme SAVY \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/phone \
            -only-testing:SAVYTests/SAVYWatchCaptureTests \
            2>&1 | tee build/tests.log | grep -E "Test Case|error:|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -E "error:" build/tests.log | sed -E 's/^.*\/([^/]+\.swift)/\1/' | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
          if ! grep -q -E "TEST SUCCEEDED" build/tests.log; then
            echo "----- compiler crash context -----"
            grep -n -A60 "Command SwiftCompile failed" build/tests.log | grep -v -E "^[0-9]+-\s*$" | cut -c1-400 | head -120 || true
            echo "----- failure lines -----"
            grep -n -i -E "error|failed|fatal|cannot|unable" build/tests.log | grep -v -i "warning" | tail -60 || true
            echo "----- last 60 lines -----"
            tail -n 60 build/tests.log
            exit 1
          fi
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-build-logs
          path: build/*.log
